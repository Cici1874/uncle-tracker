<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Phil督察站">
<link rel="manifest" href="manifest_user.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Phil の 家务督察站</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F5F0EB;
  --card: #FFFDF9;
  --primary: #9B8E82;
  --primary-light: #B5A99A;
  --accent-green: #8FA68E;
  --accent-warm: #C4917B;
  --text: #5A4F45;
  --text-light: #8A7F75;
  --border: #E0D8CF;
  --shadow: rgba(139,126,113,0.08);
  --radius: 14px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'Quicksand','Noto Serif SC',sans-serif;
  background:var(--bg); color:var(--text);
  min-height:100vh; min-height:100dvh;
  -webkit-font-smoothing:antialiased;
}

/* Header */
.app-header {
  background:var(--card); padding:16px 20px;
  border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:100;
  display:flex; align-items:center; gap:14px;
}
.header-avatar { width:44px; height:44px; border-radius:50%; object-fit:cover; border:2px solid var(--border); }
.header-text h1 { font-family:'Noto Serif SC',serif; font-size:18px; font-weight:600; }
.header-text .subtitle { font-size:12px; color:var(--text-light); margin-top:2px; }
.header-text { flex:1; }
.help-btn { width:32px; height:32px; border-radius:50%; border:1.5px solid var(--border); background:var(--card); color:var(--text-light); font-size:15px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all 0.2s; }
.help-btn:hover { border-color:var(--primary); color:var(--primary); }
.sync-btn { width:32px; height:32px; border-radius:50%; border:1.5px solid var(--accent-green); background:var(--card); color:var(--accent-green); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all 0.2s; }
.sync-btn:hover { background:var(--accent-green); color:#fff; }
.sync-btn.syncing { animation:spin 0.8s linear infinite; pointer-events:none; opacity:0.6; }

/* Phil Banner */
.phil-banner {
  background:var(--card); margin:16px; padding:16px 18px;
  border-radius:var(--radius); border-left:3px solid var(--primary);
  box-shadow:0 2px 8px var(--shadow);
  display:flex; gap:14px; align-items:flex-start;
}
.phil-banner img { width:56px; height:56px; border-radius:12px; object-fit:cover; flex-shrink:0; }
.phil-banner .phil-label { font-size:11px; color:var(--primary); font-weight:600; text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }
.phil-banner .phil-text { font-family:'Noto Serif SC',serif; font-size:13.5px; line-height:1.7; }

/* Tab Bar */
.tab-bar { display:flex; margin:0 16px; gap:4px; background:var(--card); border-radius:var(--radius); padding:4px; box-shadow:0 1px 4px var(--shadow); }
.tab-btn { flex:1; padding:10px 8px; border:none; background:transparent; border-radius:10px; font-family:'Quicksand',sans-serif; font-size:13px; font-weight:600; color:var(--text-light); cursor:pointer; transition:all 0.2s; }
.tab-btn.active { background:var(--primary); color:#fff; }

/* Stats Bar */
.stats-bar { display:flex; gap:10px; margin:16px; }
.stat-box { flex:1; background:var(--card); border-radius:var(--radius); padding:14px; text-align:center; box-shadow:0 1px 4px var(--shadow); }
.stat-num { font-size:22px; font-weight:700; color:var(--primary); }
.stat-label { font-size:11px; color:var(--text-light); margin-top:2px; }

/* Task Section */
.task-section { padding:0 16px 16px; }
.section-label { font-size:12px; font-weight:700; color:var(--primary); text-transform:uppercase; letter-spacing:1.2px; margin:16px 0 10px 4px; }

/* Task Card */
.task-card {
  background:var(--card); border-radius:var(--radius); padding:14px 16px;
  margin-bottom:8px; box-shadow:0 1px 4px var(--shadow);
  display:flex; align-items:center; gap:12px; transition:all 0.2s;
}
.task-card.completed { opacity:0.5; }
.task-card.overdue { border-left:3px solid var(--accent-warm); }
.check-circle {
  width:28px; height:28px; border-radius:50%; border:2px solid var(--border);
  flex-shrink:0; display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:all 0.2s;
}
.check-circle.checked { background:var(--accent-green); border-color:var(--accent-green); }
.check-circle.checked::after { content:'✓'; color:#fff; font-size:14px; font-weight:700; }
.task-info { flex:1; min-width:0; }
.task-name { font-size:14px; font-weight:600; }
.task-meta { font-size:11.5px; color:var(--text-light); margin-top:2px; }
.task-count { font-size:11px; color:var(--accent-green); font-weight:600; }
.photo-btn {
  width:34px; height:34px; border-radius:10px; border:1.5px dashed var(--border);
  background:transparent; display:flex; align-items:center; justify-content:center;
  cursor:pointer; flex-shrink:0; font-size:15px;
}
.undo-btn {
  padding:6px 14px; border-radius:10px; border:none;
  background:var(--accent-warm); color:#fff;
  font-family:'Quicksand',sans-serif; font-size:12px; font-weight:700;
  cursor:pointer; flex-shrink:0; animation:undoPulse 1s ease-in-out infinite alternate;
}
@keyframes undoPulse { from{opacity:1} to{opacity:0.7} }

/* Flower Card */
.flower-card {
  background:var(--card); border-radius:var(--radius); padding:16px 18px;
  margin:16px; box-shadow:0 2px 8px var(--shadow); border-top:3px solid var(--accent-warm);
}
.flower-card h3 { font-family:'Noto Serif SC',serif; font-size:15px; font-weight:600; margin-bottom:4px; }
.flower-stats { font-size:12px; color:var(--text-light); margin-bottom:10px; }
.flower-stats span { color:var(--accent-green); font-weight:600; }
.flower-actions { display:flex; gap:10px; }
.flower-btn { flex:1; padding:10px; border:none; border-radius:10px; font-family:'Quicksand',sans-serif; font-size:13px; font-weight:600; cursor:pointer; transition:all 0.2s; }
.flower-btn.wake { background:#E8D5CB; color:var(--text); }
.flower-btn.water { background:#C9D6C8; color:var(--text); }
.flower-btn:active { transform:scale(0.97); }

/* Modal Overlay */
.modal-overlay {
  position:fixed; inset:0; background:rgba(90,79,69,0.4); backdrop-filter:blur(4px);
  display:flex; align-items:flex-end; justify-content:center; z-index:200;
  animation:fadeIn 0.2s;
}
.modal-content {
  background:var(--card); border-radius:20px 20px 0 0; padding:24px 24px 36px;
  width:100%; max-width:500px; max-height:85vh; overflow-y:auto; animation:slideUp 0.3s;
}
.modal-content h3 { font-family:'Noto Serif SC',serif; font-size:17px; margin-bottom:14px; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }

/* Guide Modal */
.guide-modal .modal-content { text-align:center; }
.guide-modal .phil-hero { width:120px; height:120px; border-radius:20px; object-fit:cover; margin:0 auto 16px; }
.guide-modal h2 { font-family:'Noto Serif SC',serif; font-size:20px; margin-bottom:8px; }
.guide-modal p { font-size:14px; line-height:1.7; color:var(--text); margin-bottom:8px; }
.guide-modal .guide-steps { text-align:left; margin:16px 0; }
.guide-modal .guide-step { display:flex; gap:12px; margin-bottom:14px; align-items:flex-start; }
.guide-modal .step-num { width:28px; height:28px; border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0; }
.guide-modal .step-text { font-size:13.5px; line-height:1.6; padding-top:3px; }

/* Changelog Modal */
.changelog-modal h2 { font-family:'Noto Serif SC',serif; font-size:18px; margin-bottom:12px; }
.changelog-modal .version-tag { display:inline-block; background:var(--primary); color:#fff; padding:2px 10px; border-radius:20px; font-size:12px; font-weight:700; margin-bottom:12px; }
.changelog-modal ul { list-style:none; padding:0; }
.changelog-modal li { font-size:13.5px; line-height:1.7; padding:4px 0; padding-left:20px; position:relative; }
.changelog-modal li::before { content:'✦'; position:absolute; left:0; color:var(--primary); }

/* Photo upload */
.photo-preview { width:100%; border-radius:12px; margin:12px 0; object-fit:cover; max-height:300px; }
.upload-area { border:2px dashed var(--border); border-radius:12px; padding:30px; text-align:center; cursor:pointer; margin:12px 0; }
.upload-area .icon { font-size:28px; }
.upload-area p { font-size:14px; color:var(--text-light); margin-top:8px; }
.submit-btn {
  width:100%; padding:14px; border:none; border-radius:12px; background:var(--primary); color:#fff;
  font-family:'Quicksand',sans-serif; font-size:15px; font-weight:600; cursor:pointer; margin-top:12px;
}
.submit-btn:disabled { opacity:0.5; cursor:not-allowed; }

/* Toast */
.toast {
  position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
  background:var(--text); color:#fff; padding:14px 24px; border-radius:14px;
  font-family:'Noto Serif SC',serif; font-size:13px; line-height:1.6;
  max-width:340px; text-align:center; z-index:300;
  animation:toastIn 0.3s, toastOut 0.3s 4.5s forwards;
  box-shadow:0 4px 20px rgba(0,0,0,0.15);
  display:flex; align-items:center; gap:12px;
}
.toast-text { flex:1; }
.toast-undo { background:rgba(255,255,255,0.2); border:none; color:#fff; padding:4px 12px; border-radius:8px; font-family:'Quicksand',sans-serif; font-size:12px; font-weight:700; cursor:pointer; flex-shrink:0; }
@keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(20px)} }
@keyframes toastOut { to{opacity:0;transform:translateX(-50%) translateY(20px)} }

/* History */
.history-item { background:var(--card); border-radius:var(--radius); padding:14px 16px; margin-bottom:8px; box-shadow:0 1px 4px var(--shadow); }
.history-date { font-size:12px; font-weight:700; color:var(--primary); margin-bottom:4px; }
.history-task { font-size:14px; }
.history-photo { width:60px; height:60px; border-radius:8px; object-fit:cover; margin-top:6px; }

/* Loading */
.loading-spinner { display:inline-block; width:20px; height:20px; border:2px solid var(--border); border-top-color:var(--primary); border-radius:50%; animation:spin 0.6s linear infinite; }
@keyframes spin { to{transform:rotate(360deg)} }

.bottom-spacer { height:80px; }

/* Phil achievement image */
.achievement-img { display:block; width:100px; height:100px; border-radius:16px; object-fit:cover; margin:12px auto; }

/* Gallery */
.gallery-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:16px; }
.gallery-item { position:relative; border-radius:12px; overflow:hidden; aspect-ratio:1; cursor:pointer; box-shadow:0 2px 8px var(--shadow); }
.gallery-item img { width:100%; height:100%; object-fit:cover; transition:transform 0.3s; }
.gallery-item:hover img { transform:scale(1.05); }
.gallery-item.locked { cursor:default; }
.gallery-item.locked img { filter:blur(12px) brightness(0.5); }
.gallery-lock { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,0.5); }
.gallery-lock .lock-icon { font-size:24px; margin-bottom:4px; }
.gallery-lock .lock-text { font-size:11px; font-weight:600; }
.gallery-progress { background:var(--card); margin:16px; padding:16px 20px; border-radius:var(--radius); box-shadow:0 2px 8px var(--shadow); text-align:center; }
.gallery-progress .prog-num { font-size:28px; font-weight:700; color:var(--primary); }
.gallery-progress .prog-label { font-size:12px; color:var(--text-light); margin-top:2px; }
.gallery-progress .prog-bar { height:6px; background:var(--border); border-radius:3px; margin-top:10px; overflow:hidden; }
.gallery-progress .prog-fill { height:100%; background:var(--accent-green); border-radius:3px; transition:width 0.5s; }

/* Gallery Lightbox */
.gallery-lightbox { position:fixed; inset:0; background:rgba(0,0,0,0.88); z-index:300; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; animation:fadeIn 0.2s; }
.gallery-lightbox img { max-width:90vw; max-height:60vh; border-radius:12px; object-fit:contain; }
.gallery-lightbox .lb-quote { font-family:'Noto Serif SC',serif; color:#fff; font-size:14px; line-height:1.7; text-align:center; max-width:320px; margin-top:16px; opacity:0.9; }
.gallery-lightbox .lb-milestone { font-size:11px; color:rgba(255,255,255,0.5); margin-top:8px; }
.gallery-lightbox .lb-close { position:absolute; top:16px; right:20px; color:#fff; font-size:24px; cursor:pointer; background:none; border:none; }
</style>
</head>

// ══════════ HELPERS ══════════
function isCompletedInPeriod(taskId,freq,records) {
  var days=FREQ_DAYS[freq], cutoff=new Date(Date.now()-days*864e5);
  var task=TASKS.find(function(t){return t.id===taskId});
  var target=task&&task.target?task.target:1;
  var count=records.filter(function(r){return r.taskId===taskId&&new Date(r.date)>cutoff}).length;
  return count>=target;
}
function getPeriodProgress(taskId,freq,records) {
  var days=FREQ_DAYS[freq], cutoff=new Date(Date.now()-days*864e5);
  var task=TASKS.find(function(t){return t.id===taskId});
  var target=task&&task.target?task.target:1;
  var count=records.filter(function(r){return r.taskId===taskId&&new Date(r.date)>cutoff}).length;
  return {count:count,target:target};
}
function isOverdue(taskId,freq,records) {
  // Grace period: first 7 days after first-ever record, nothing is overdue
  if(records.length>0) {
    var firstEver=new Date(Math.min.apply(null,records.map(function(r){return new Date(r.date).getTime()})));
    if((Date.now()-firstEver)<7*864e5) return false;
  }
  // Never done anything = not overdue during grace (handled above if records exist)
  // If no records at all, also grace
  var days=FREQ_DAYS[freq], tr=records.filter(function(r){return r.taskId===taskId});
  if(!tr.length) { return records.length>0; }  // only overdue if user has SOME records but not this task
  var last=new Date(Math.max.apply(null,tr.map(function(r){return new Date(r.date).getTime()})));
  return (Date.now()-last)>(days+2)*864e5;
}
function getTaskCount(taskId,records) {
  return records.filter(function(r){return r.taskId===taskId}).length;
}
function getWeeklyCompletions(records) {
  var ws=new Date(); ws.setDate(ws.getDate()-ws.getDay()); ws.setHours(0,0,0,0);
  return records.filter(function(r){return new Date(r.date)>=ws}).length;
}

async function uploadToCloudinary(file) {
  var fd=new FormData(); fd.append('file',file); fd.append('upload_preset',CLOUDINARY_PRESET); fd.append('folder','uncle-inspector');
  var r=await fetch('https://api.cloudinary.com/v1_1/'+CLOUDINARY_CLOUD+'/image/upload',{method:'POST',body:fd});
  return (await r.json()).secure_url;
}

// ══════════ TASK CARD ══════════
function TaskCard({task,records,onCheck,recentUndo,onUndo}) {
  var completed=isCompletedInPeriod(task.id,task.freq,records);
  var overdue=!completed&&isOverdue(task.id,task.freq,records);
  var count=getTaskCount(task.id,records);
  var prog=getPeriodProgress(task.id,task.freq,records);
  var cn='task-card'; if(completed) cn+=' completed'; if(overdue) cn+=' overdue';
  var showUndo=recentUndo===task.id;
  return e('div',{className:cn},
    e('div',{className:'check-circle '+(completed?'checked':''),onClick:function(){!completed&&onCheck(task)}}),
    e('div',{className:'task-info'},
      e('div',{className:'task-name'},task.name),
      e('div',{className:'task-meta'},
        FREQ_LABELS[task.freq],
        prog.target>1?' · 本周期 '+prog.count+'/'+prog.target:(task.note?' · '+task.note:''),
        overdue?' · ⚠ 超期了':'',
      ),
      count>0?e('div',{className:'task-count'},'累计完成 '+count+' 次'):null,
    ),
    showUndo?e('button',{className:'undo-btn',onClick:function(){onUndo()}},'撤销'):null,
    !showUndo&&task.photo&&!completed?e('button',{className:'photo-btn',onClick:function(){onCheck(task)}},'📷'):null,
  );
}

      try{
        var p=new URLSearchParams({action:'addRecord',taskId:r.taskId,taskName:r.taskName,date:r.date,photoUrl:r.photoUrl||'',freq:r.freq});
        fetch(SHEET_API+'?'+p.toString(),{mode:'no-cors',redirect:'follow'});
      }catch(e){}
    });
    localFlowers.forEach(function(f){
      try{
        var p=new URLSearchParams({action:'addFlower',type:f.type,date:f.date});
        fetch(SHEET_API+'?'+p.toString(),{mode:'no-cors',redirect:'follow'});
      }catch(e){}
    });
    // Give requests 3 seconds to fire off, then show done
    setTimeout(function(){
      setSyncing(false);
      showToastFn('同步已发送！'+localRecs.length+' 条打卡 + '+localFlowers.length+' 条鲜花记录');
    },3000);
  };

  // Startup sync: merge Sheet data into localStorage (id-based, not overwrite)
  useEffect(function(){
    if(SHEET_API==='https://script.google.com/macros/s/AKfycbxjr92-25m5Ud7jv3DbHG_kjkaONS18FAjlBwVOh_P9WDg1HBwaDEU4SPNSUUK_yCCD/exec') return; // skip if not configured
    // Records merge
    fetch(SHEET_API+'?action=getRecords').then(function(r){return r.json()}).then(function(cloudRecs){
      if(!Array.isArray(cloudRecs)||!cloudRecs.length) return;
      var local=loadRecords();
      // Build set of existing local record keys (taskId+date) to avoid duplicates
      var localKeys=new Set(local.map(function(r){return r.taskId+'|'+r.date}));
      var merged=local.slice();
      var added=0;
      cloudRecs.forEach(function(cr){
        var key=cr.taskId+'|'+cr.date;
        if(!localKeys.has(key)){merged.push(cr);added++}
      });
      if(added>0){saveRecords(merged);setRecords(merged)}
    }).catch(function(){});
    // Flowers merge
    fetch(SHEET_API+'?action=getFlowers').then(function(r){return r.json()}).then(function(cloudFl){
      if(!Array.isArray(cloudFl)||!cloudFl.length) return;
      var local=loadFlowerLog();
      var localKeys=new Set(local.map(function(f){return f.type+'|'+f.date}));
      var merged=local.slice();
      var added=0;
      cloudFl.forEach(function(cf){
        var key=cf.type+'|'+cf.date;
        if(!localKeys.has(key)){merged.push(cf);added++}
      });
      if(added>0){saveFlowerLog(merged);setFlowerLog(merged)}
    }).catch(function(){});
  },[]);

  var toastTimerRef=useRef(null);
  var undoTimerRef=useRef(null);
  var rus=useState(null),recentUndo=rus[0],setRecentUndo=rus[1];
  var showToastFn=useCallback(function(text){
    if(toastTimerRef.current) clearTimeout(toastTimerRef.current);
    setToast({text:text});
    toastTimerRef.current=setTimeout(function(){setToast(null)},4000);
  },[]);
  var handleCheck=function(task){task.photo?setModal(task):completeTask(task,'')};
  var undoLastCheckin=function(){
    var nr=records.slice(0,-1); setRecords(nr); saveRecords(nr);
    setRecentUndo(null);
    if(undoTimerRef.current) clearTimeout(undoTimerRef.current);
    showToastFn('已撤销。本猫当做什么都没发生。');
  };
  var completeTask=async function(task,photoUrl){
    var rec={taskId:task.id,taskName:task.name,freq:task.freq,date:new Date().toISOString(),photoUrl:photoUrl};
    var nr=[].concat(records,[rec]); setRecords(nr); saveRecords(nr); syncToSheet(rec);
    // Show undo button on this task for 15 seconds
    setRecentUndo(task.id);
    if(undoTimerRef.current) clearTimeout(undoTimerRef.current);
    undoTimerRef.current=setTimeout(function(){setRecentUndo(null)},15000);
    var newCount=nr.length;
    var unlockHit=false;
    if(typeof GALLERY_CONFIG!=='undefined'){
      for(var gi=0;gi<GALLERY_CONFIG.length;gi++){
        if(GALLERY_CONFIG[gi].milestone===newCount){unlockHit=true;break}
      }
    }
    if(unlockHit){
      showToastFn('🎨 新画作解锁！去画廊看看');
    } else {
      showToastFn(photoUrl?pickRandom(PHIL_PHOTO):pickRandom(PHIL_CHECKIN));
    }
  };
  var handleFlower=function(type){
    var entry={type:type,date:new Date().toISOString()};
    var nl=[].concat(flowerLog,[entry]); setFlowerLog(nl); saveFlowerLog(nl); syncFlowerToSheet(entry);
    showToastFn(type==='wake'?'本猫承认鲜花让这个房间的ROI有所提升。仅限视觉层面。':'换水记录已更新。本猫替那些花谢谢舅舅。');
  };
  var closeGuide=function(){setShowGuide(false);markGuideSeen();if(getSeenVersion()!==APP_VERSION){setShowChangelog(true)}};
  var closeChangelog=function(){setShowChangelog(false);setSeenVersion(APP_VERSION)};
  var sortedTasks=function(freq){
    return TASKS.filter(function(t){return t.freq===freq}).sort(function(a,b){
      var ad=isCompletedInPeriod(a.id,a.freq,records),bd=isCompletedInPeriod(b.id,b.freq,records);
      if(ad!==bd) return ad?1:-1;
      var ao=isOverdue(a.id,a.freq,records),bo=isOverdue(b.id,b.freq,records);
      if(ao!==bo) return ao?-1:1; return 0;
    });
  };

  return e(React.Fragment,null,
    e('div',{className:'app-header'},
      e('img',{src:PHIL_IMAGES.avatar,className:'header-avatar'}),
      e('div',{className:'header-text'},e('h1',null,'Phil の 家务督察站'),e('div',{className:'subtitle'},'v'+APP_VERSION+' · 舅舅专用')),
      e('button',{className:'sync-btn'+(syncing?' syncing':''),onClick:syncAllToSheet,title:'同步数据到云端'},'☁'),
      e('button',{className:'help-btn',onClick:function(){setShowGuide(true)},title:'使用指南'},'?'),
    ),
    e(PhilBanner,{records:records}),
    e(StatsBar,{records:records}),
    e('div',{className:'tab-bar'},
      e('button',{className:'tab-btn'+(tab==='tasks'?' active':''),onClick:function(){switchTab('tasks')}},'待办'),
      e('button',{className:'tab-btn'+(tab==='history'?' active':''),onClick:function(){switchTab('history')}},'记录'),
      e('button',{className:'tab-btn'+(tab==='gallery'?' active':''),onClick:function(){switchTab('gallery')}},'画廊'),
    ),
    tab==='tasks'?e(React.Fragment,null,
      e(FlowerCard,{flowerLog:flowerLog,onAction:handleFlower}),
      e('div',{className:'task-section'},e('div',{className:'section-label'},'每周任务'),sortedTasks('weekly').map(function(t){return e(TaskCard,{key:t.id,task:t,records:records,onCheck:handleCheck,recentUndo:recentUndo,onUndo:undoLastCheckin})})),
      e('div',{className:'task-section'},e('div',{className:'section-label'},'每两周任务'),sortedTasks('biweekly').map(function(t){return e(TaskCard,{key:t.id,task:t,records:records,onCheck:handleCheck,recentUndo:recentUndo,onUndo:undoLastCheckin})})),
      e('div',{className:'task-section'},e('div',{className:'section-label'},'每月任务'),sortedTasks('monthly').map(function(t){return e(TaskCard,{key:t.id,task:t,records:records,onCheck:handleCheck,recentUndo:recentUndo,onUndo:undoLastCheckin})})),
    ):tab==='history'?e(HistoryView,{records:records}):e(GalleryView,{totalCount:records.length}),
    e('div',{className:'bottom-spacer'}),
    modal?e(PhotoModal,{task:modal,onClose:function(){setModal(null)},onSubmit:completeTask}):null,
    toast?e('div',{className:'toast'},e('span',{className:'toast-text'},toast.text)):null,
    showGuide?e(GuideModal,{onClose:closeGuide}):null,
    showChangelog?e(ChangelogModal,{onClose:closeChangelog}):null,
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js?v=1.4.2')}
</script>
</body>
</html>
